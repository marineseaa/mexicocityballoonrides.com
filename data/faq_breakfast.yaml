title: "Balloon Breakfast FAQ"
subtitle: "Short answers on La Gruta, cave breakfasts, menus and prices."
items:
  - question: "Is every balloon cave breakfast at La Gruta?"
    answer: "No. La Gruta is one restaurant in a natural cave about 200 m from Gate 5 behind the Pyramid of the Sun. Many operators serve breakfast in their own natural caves, and others serve a buffet at a restaurant or at the balloon port. We Fly's listing names La Gruta; most cave listings do not."
  - question: "How long is the wait for breakfast at La Gruta?"
    answer: "No operator gives a time. We Fly's own listing says breakfast at La Gruta is subject to availability and that the waiting time outside the restaurant is beyond its control. Build some slack into your morning."
  - question: "What is served at a Teotihuacán balloon breakfast?"
    answer: "Most listings just say breakfast. Visita Teotihuacan lists fruit, artisan bread, coffee and chilaquiles with chicken, steak or egg, or an omelet, with vegan options. Explora México offers chilaquiles, enchiladas or quesadillas with orange juice, coffee, sweet bread and fruit."
  - question: "How much does breakfast add to a balloon flight?"
    answer: "About $44 to $60 per person on dates we checked in late October 2026: Skyteam was $137 for the flight and $181 with a cave breakfast, Tlatoani $157 and $201, and We Fly $143 and $203 with La Gruta. See every package on our <a href='/teotihuacan-balloon-ride-prices/'>prices page</a>."
  - question: "Can I book breakfast without hotel transport?"
    answer: "Yes. Skyteam, Tlatoani and We Fly all sell flight plus cave breakfast for guests who drive to the balloon port. If you are staying nearby, see <a href='/teotihuacan-balloon-flight-only/'>flight-only tickets</a> as well."
  - question: "Is it cold inside the cave?"
    answer: "Chilango described La Gruta as cool inside, around 6 °C, and winter dawns in the valley average lows of about 2 to 4 °C. Keep the jacket you flew in. Our <a href='/guides/what-to-wear-teotihuacan-balloon-ride/'>what to wear guide</a> has the details."

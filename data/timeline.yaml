# Labels are plain Unicode; narrative/body allow inline HTML.
overline: "How a flight morning runs"
title: "A Balloon Morning, Hour by Hour"
narrative: "What first-timers often don't realize is how little of the morning is actually spent in the air. The flight itself usually lasts around 45 to 60 minutes, while the full experience can take five to nine hours from hotel pickup to drop-off. Despite the pre-dawn pickup, you don't fly in the dark. Balloons lift off around first light, putting you in the air around sunrise."
stops:
  - label: "Pickup in the dark, about 4:30–5:40 a.m."
    body: "Hotel pickups from Mexico City typically leave between about 4:30 and 5:40, and the operator sends the exact time the day before. Be ready early: one operator, Globos Aerostáticos Teotihuacán, allows only 10 minutes' grace before the van leaves without you."
  - label: "The drive northeast"
    body: "Roughly 45 to 60 minutes up the Mexico–Pachuca motorway to the launch fields around San Martín de las Pirámides, beside the archaeological zone. If you booked flight only, this is your own drive."
  - label: "Check-in and coffee, about 5:30"
    body: "We Fly asks guests to be at reception around 5:30 for check-in and coffee. Bring photo ID: some operators register every passenger under the flight insurance and will not board you without it."
  - label: "Inflation and lift-off at first light"
    body: "You watch the crew inflate the balloon, then climb into the basket once it stands. Lift-off follows the light, which moves with the season: sunrise at Teotihuacán is about 7:05 in late December, 6:38 in late March, 5:57 in late June and 6:33 in late October."
  - label: "The flight, 45–60 minutes"
    body: "Operators quote anything from 30 to 60 minutes in the air, most often 45 to 60. The wind sets the route, so the balloon may pass over the Pyramids of the Sun and the Moon or keep to one side of them."
  - label: "Landing, toast and certificate"
    body: "The ground crew meets the balloon where it lands. Operators mark the landing with a sparkling-wine toast and hand out a personalized flight certificate."
  - label: "Breakfast, if your package includes it"
    body: "Packages with breakfast continue to a restaurant, sometimes a cave restaurant such as La Gruta. Flight-only tickets end at the toast."
  - label: "The pyramids, from 8:00"
    body: "The archaeological zone opens at 8:00, so a visit fits after breakfast. Admission (MX$210 for foreign visitors in 2026) is not included in most balloon packages, and the Pyramid of the Sun cannot be climbed."
  - label: "Back in the city, about 10:00 or 14:30"
    body: "One operator's schedule gives the range: back in Mexico City around 10:00 if you return straight after the flight, or around 14:30 with a visit to the ruins."

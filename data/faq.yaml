title: "Teotihuacán Balloon Ride FAQ"
subtitle: "Short answers to the questions people ask before they book a balloon flight from Mexico City."

items:
  - question: "Do hot-air balloons fly over Mexico City?"
    answer: "No. The balloon flights sold to Mexico City visitors take off in the Teotihuacán valley, mostly around San Martín de las Pirámides, roughly 45 to 50 km northeast of the city by road. Operators collect you from your hotel before dawn and drive you there in about 45 to 60 minutes. Our page on <a href='/teotihuacan-balloon-rides-from-mexico-city/'>balloon rides from Mexico City</a> compares the transfers."

  - question: "How much does a Teotihuacán balloon ride cost?"
    answer: "Across the flights in our comparison table, on dates we checked in late October 2026, the flight alone cost about $137 to $148 per person and packages with transport from Mexico City and a cave breakfast about $211 to $236. A private basket for two was about $1,017 for the pair. The headline price on most listings is the flight-only option, so check which option you are booking. Every tier is on our <a href='/teotihuacan-balloon-ride-prices/'>prices page</a>."

  - question: "What time is pickup in Mexico City?"
    answer: "Usually between about 4:30 and 5:40 a.m., confirmed by the operator the day before. Check-in at the launch field is around 5:30 at operators such as We Fly. Public buses from Terminal Norte do not run early enough. See <a href='/guides/how-to-get-to-teotihuacan-balloon-port/'>how to get to the balloon port</a>."

  - question: "Will the balloon fly over the pyramids?"
    answer: "Only if the wind allows it. Operators look for currents toward the archaeological zone, but none guarantees the route: on some mornings you pass over the Pyramids of the Sun and the Moon, on others you see them from one side of the valley. Read <a href='/guides/do-balloons-fly-over-teotihuacan-pyramids/'>do balloons fly over the pyramids?</a>"

  - question: "Is admission to the pyramids included?"
    answer: "Usually not. INAH charges foreign visitors MX$210 in 2026 (about $11), and most balloon packages list it as excluded. The zone opens at 8:00, after most flights have landed. If you want a guide and the ticket arranged, look at a <a href='/teotihuacan-balloon-and-pyramids-tour/'>balloon and pyramids tour</a> and check that its option lists admission."

  - question: "When is the best time of year for a balloon ride?"
    answer: "Flights run all year. The dry season from November to April is the steadier choice, with historical averages of about 31 mm of rain a month or less, though winter cold fronts can bring wind that grounds every balloon. Dawns are cold, around 2 to 4 °C on average from December to March. See the <a href='/guides/best-time-teotihuacan-balloon-ride/'>best time for a balloon ride</a>."

  - question: "What happens if my flight is cancelled for weather?"
    answer: "The pilot decides each morning, and balloons fly only in light winds. Operators handle weather cancellations on their own terms: We Fly reschedules to another sunrise at no cost, while Globos Aerostáticos Teotihuacán reschedules the flight but does not refund extras. Viator's standard policy separately lets you cancel for a full refund up to 24 hours before the start. Details in <a href='/guides/teotihuacan-balloon-weather-cancellations/'>weather cancellations and refunds</a>, and each operator's own cancellation window in <a href='/guides/how-to-book-teotihuacan-balloon-ride/'>how to book a balloon ride</a>."

  - question: "Are there age, weight or health limits?"
    answer: "Yes, and they vary by operator. We Fly sets a minimum age of 4 on its Viator listing; Viaja Teotihuacan and Skyteam charge MX$35 per kilo above 100 kg. The listings we checked turn away or advise against pregnant passengers and people with heart or spine problems. Our guide to <a href='/guides/teotihuacan-balloon-ride-weight-limits/'>weight limits and restrictions</a> compares the rules."

  - question: "How do I check that a balloon operator is legitimate?"
    answer: "Ask for the operator's AFAC permit, the pilot's license and proof of passenger insurance; the authorities advise travelers to confirm the permit before boarding. In March 2026 AFAC inspected balloons in the valley and suspended three establishments. Our <a href='/guides/teotihuacan-balloon-ride-safety/'>balloon safety guide</a> lists what to ask."

title: "Choosing a Teotihuacán Balloon Ride: FAQ"
subtitle: "Short answers on which ride to book, what is included and what the listings do not promise."
items:
  - question: "Which Teotihuacán balloon ride is best for a first-timer?"
    answer: "If you are staying in Mexico City, an all-inclusive package with hotel transport and breakfast. Our pick is Viaja Teotihuacan's full option, about $236 per person on dates we checked in late October 2026, rated 4.9 from 8,250+ reviews. If you have a car, a flight-only option from about $137 does the same flight for less. See our <a href='/tours/viaja-teotihuacan-balloon-flight-cave-breakfast/'>Viaja Teotihuacan review</a>."
  - question: "Do the balloons fly over Mexico City or over the pyramids?"
    answer: "Not over the city, and not on a fixed route. Balloons launch in the Teotihuacán valley, around San Martín de las Pirámides, about an hour northeast of Mexico City. Operators steer for winds that carry them toward the archaeological zone, but whether you pass over the Pyramids of the Sun and Moon or beside them depends on the wind that morning. More in <a href='/guides/do-balloons-fly-over-teotihuacan-pyramids/'>do balloons fly over the pyramids</a>."
  - question: "Is the archaeological zone ticket included?"
    answer: "Usually not. Most packages give you free time at the pyramids but leave the ticket to you: MX$210 for foreign visitors in 2026, with under-13s and over-60s exempt. A few packages include it, such as the Excellentravel balloon and guided pyramids tour and the Zuyuá private balloon for two. Check the option's inclusions before you book."
  - question: "Shared basket or private basket?"
    answer: "Shared, unless the morning is a celebration. A private basket for two was about $1,017 for the pair on the Zuyuá listing, several times the shared price. Shared flights from Mexico City with breakfast cost about $186 to $240 per person. Our <a href='/guides/shared-vs-private-teotihuacan-balloon-rides/'>shared vs private guide</a> sets out the trade-offs."
  - question: "What happens if the weather cancels the flight?"
    answer: "The pilot decides on the morning, and operators reschedule or refund on their own terms, so read the listing's policy. On Viator, listings marked free cancellation give a full refund if you cancel at least 24 hours before the start time. See <a href='/guides/teotihuacan-balloon-weather-cancellations/'>weather and cancellations</a>."
  - question: "Is there a weight limit?"
    answer: "Most operators charge extra above about 100 kg. Viaja Teotihuacan and Skyteam charge MXN 35 per extra kilo, Tlatoani charges MXN 500 from 100 to 120 kg and MXN 1,000 from 120 to 140 kg, and We Fly charges MXN 45 per kilo above 99 kg. Details in our <a href='/guides/teotihuacan-balloon-ride-weight-limits/'>weight limits guide</a>."

title: "Teotihuacán Balloon Ride Prices: FAQ"
subtitle: "Short answers on what a balloon ride costs, what is extra and why the headline price is lower than what you pay."
items:
  - question: "How much is a hot air balloon ride in Teotihuacán?"
    answer: "On the listings we review, a shared flight alone was about $137 to $159 per person on dates we checked in late October 2026. With round-trip transport from Mexico City and breakfast it was about $186 to $240. Private baskets on the listings we found ran from about $476 per person to $1,017 for two."
  - question: "Why is the price at checkout higher than the headline price?"
    answer: "Because the headline from-price on most listings is the flight-only option, where you drive yourself to the balloon port and get no breakfast. Choosing breakfast or transport moves you to a dearer option. Tlatoani, for example, shows $157 but its all-inclusive option was $240. See our <a href='/tours/tlatoani-teotihuacan-balloon-flight-cave-breakfast/'>Tlatoani review</a>."
  - question: "Is the pyramids entrance fee included in the balloon ride price?"
    answer: "Usually not. The archaeological-zone ticket is MX$210, about $11, for foreign visitors in 2026; children under 13 and people over 60 are exempt. Some packages include it, such as the Excellentravel guided tour, the Zuyuá private balloon and We Fly's all-included option. Read the option's inclusions."
  - question: "Do heavier passengers pay more?"
    answer: "With most operators, yes, above about 100 kg. Skyteam and Viaja Teotihuacan charge MXN 35 per extra kilo; Tlatoani charges MXN 500 from 100 to 120 kg and MXN 1,000 from 120 to 140 kg. See the <a href='/guides/teotihuacan-balloon-ride-weight-limits/'>weight limits guide</a>."
  - question: "Is a flight-only option worth it?"
    answer: "If you have a car or are staying in San Juan Teotihuacán, yes: the flight is the same shared sunrise flight, and among the flights we review Skyteam's flight only was the lowest at about $137. Without a car it is hard to reach the balloon port before dawn. See our <a href='/teotihuacan-balloon-flight-only/'>flight-only page</a>."
  - question: "Do I get my money back if the weather cancels the flight?"
    answer: "It depends on the operator. Some reschedule for free and some refund; Viator's standard policy gives a full refund if you cancel at least 24 hours before the start time on listings marked free cancellation. More in <a href='/guides/teotihuacan-balloon-weather-cancellations/'>weather and cancellations</a>."

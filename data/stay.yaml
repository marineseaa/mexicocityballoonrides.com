areas:
  - key: juarez
    name: "Juárez and Reforma"
    why: "The Angel of Independence is the pickup corner several operators use, and Juárez sits around it. Walkable, central, inside every shuttle list we read."
    address: "Juarez, Mexico City, Mexico"
    searchLabel: "All stays in Juárez"
    hotels: [hotel_geneve, sofitel_reforma, four_seasons]
  - key: centro
    name: "Centro Histórico"
    why: "The closest of the pickup neighborhoods to the northbound road out of the city, with the best-reviewed value hotels. Quiet streets after dark."
    address: "Centro Historico, Mexico City, Mexico"
    searchLabel: "All stays in Centro Histórico"
    hotels: [hotel_catedral, gran_hotel]
  - key: teotihuacan
    name: "San Juan Teotihuacán"
    why: "Minutes from the balloon ports and the right base for a flight-only booking. Small hotels with free parking; little to do at night."
    address: "San Juan Teotihuacan, Mexico"
    searchLabel: "All stays in San Juan Teotihuacán"
    hotels: [villas_arqueologicas, quinto_sol, finca_abuelo]
  - key: romacondesa
    name: "Roma Norte and Condesa"
    why: "Leafy streets and restaurants, inside the pickup lists, a few minutes farther from the exit road than Centro."
    address: "Roma Norte, Mexico City, Mexico"
    searchLabel: "All stays in Roma and Condesa"
    hotels: [villa_condesa, casa_decu, brick]
  - key: polanco
    name: "Polanco"
    why: "The upscale hotel district. On We Fly's express shuttle list, but outside its free pickup radius."
    address: "Polanco, Mexico City, Mexico"
    searchLabel: "All stays in Polanco"
    hotels: [hyatt_regency, las_alcobas]
  - key: airport
    name: "Mexico City airport (AICM)"
    why: "For a late arrival or an early flight out. No shuttle list we read includes it."
    address: "Mexico City International Airport, Mexico"
    hotels: [hilton_airport]


title: "Flight-Only Balloon Rides: FAQ"
subtitle: "Short answers for self-drivers and anyone staying near the pyramids."
items:
  - question: "Can I book a Teotihuacán balloon flight without transportation?"
    answer: "Yes. Most listings sell a flight-only option, and it is usually the headline price. Among the flights we review it ran from about $137 (Skyteam) to $159 (Volare and Cielo Azteca) per person on dates we checked in late October 2026. You get yourself to the balloon port before dawn."
  - question: "What does the flight-only option include?"
    answer: "The shared sunrise flight, and with most operators a coffee break before it and a sparkling-wine toast and flight certificate after it. Transport and breakfast are not included, except that Volare's no-transport option includes breakfast at its balloon port. The archaeological-zone ticket, MX$210 for foreign visitors in 2026, is extra."
  - question: "Can I take a bus or Uber to the balloon port?"
    answer: "Not by bus: the Autobuses Teotihuacan ticket window at Terminal Norte opens at 6:00 and the buses stop at the archaeological-zone gates, not the launch fields. We could not confirm ride-hail availability before dawn. Without a car, book a <a href='/teotihuacan-balloon-rides-from-mexico-city/'>ride with pickup from Mexico City</a> or stay nearby."
  - question: "How do I find the balloon port?"
    answer: "The operator sends the location, sometimes as a Google Maps pin with your arrival time, the day before your flight. The launch fields are in the valley around San Martín de las Pirámides, so navigate to that pin, not to the pyramids. Our guide to <a href='/guides/how-to-get-to-teotihuacan-balloon-port/'>getting to the balloon port</a> covers the route."
  - question: "Is there parking at the balloon port?"
    answer: "Cielo Azteca says flight-only guests have a secure parking lot at its take-off area, and We Fly's own site offers free on-site parking. Other listings do not say, so ask when the location message arrives."
  - question: "What time do I need to arrive?"
    answer: "Typically around 5:30 to 6:00 a.m.; We Fly's guests arrive at reception around 5:30 and Fly Teotihuacan schedules check-in for 5:40. The operator confirms your time the day before. Bring a photo ID for registration."

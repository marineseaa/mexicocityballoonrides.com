title: "Private Balloon Ride FAQ"
subtitle: "Short answers on private baskets, prices for two and proposals."
items:
  - question: "How much is a private balloon ride over Teotihuacán?"
    answer: "On dates we checked in late October 2026, Teotihuacán Feliz's private balloon flight was about $476 per person, so about $952 for two, with private transport and breakfast but before zone entry. See every tier on our <a href='/teotihuacan-balloon-ride-prices/'>prices page</a>."
  - question: "Is a private tour the same as a private balloon?"
    answer: "No. Luxury Tours and Excellentravel sell a private car and guide but fly you in a shared basket; Excellentravel says the flight is shared in small groups. Only a private balloon listing, such as Teotihuacán Feliz's, puts your party alone in the basket. More in <a href='/guides/shared-vs-private-teotihuacan-balloon-rides/'>shared vs private balloon rides</a>."
  - question: "Can I propose in a private balloon?"
    answer: "Book a private basket if you want to be sure no other passengers are with you. None of the marketplace listings we cover describes a proposal package, so message the operator before booking and ask what they can arrange. HappyFly sells a celebration package for two direct, at MXN 9,500 with a banner, roses, a cake and a photo session; see our <a href='/guides/teotihuacan-balloon-ride-for-two/'>balloon ride for two</a> guide."
  - question: "Is the Teotihuacán Feliz price per person?"
    answer: "Yes. Teotihuacán Feliz prices its private balloon flight per person: about $476 each, so about $952 for a couple. Confirm the total for your party at checkout, because the schedule lists the flight per person."
  - question: "Does a private flight go over the pyramids?"
    answer: "Not guaranteed. A private basket does not change the wind, which decides the route. See <a href='/guides/do-balloons-fly-over-teotihuacan-pyramids/'>do balloons fly over the pyramids</a>."
  - question: "Is the archaeological-zone entry included in private packages?"
    answer: "With Luxury Tours and Excellentravel, yes. Teotihuacán Feliz's private flight excludes the entry ticket despite its title, so budget MX$210 per foreign visitor."

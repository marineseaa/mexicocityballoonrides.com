title: "Balloon and Pyramids FAQ"
subtitle: "Short answers on guides, entry tickets, climbing and timing."
items:
  - question: "Is the Teotihuacán entry ticket included in balloon packages?"
    answer: "Usually not. Foreign visitors paid MX$210 in 2026 and Mexican nationals and foreign residents MX$105; under-13s and over-60s enter free. Packages with a named guide, such as Amigo Tours' guided option, Excellentravel and Luxury Tours, include the ticket, as does We Fly's all-inclusive option. Volare's listing says the fee is paid in cash at the gate."
  - question: "Do balloon tours include a guide at the pyramids?"
    answer: "Only some. Most packages give you one to two hours of free time on foot. Amigo Tours' top option, Excellentravel, Luxury Tours and We Fly's all-included option name a guide; Excellentravel's listing says its guide is certified by SECTUR."
  - question: "Can you climb the pyramids after the balloon ride?"
    answer: "Not the Pyramid of the Sun: INAH prohibits climbing it, and it has been closed since 2020. The Pyramid of the Moon's first tier reopened in May 2025 but was closed again after the April 2026 shooting until further notice. Check the current status before you go."
  - question: "What time does the archaeological zone open?"
    answer: "At 8:00 a.m., with last entry at 4:30 p.m. and closing at 5:00 p.m. That fits neatly after a sunrise flight and breakfast. More ideas in <a href='/guides/what-to-do-after-teotihuacan-balloon-flight/'>what to do after the flight</a>."
  - question: "What is the balloon and Guadalupe tour?"
    answer: "Amigo Tours' top option adds a guided hour at the Basilica of Guadalupe after about three hours at Teotihuacán and an obsidian workshop. The coach drops everyone back at the Ángel de la Independencia, but you can stay at the Basilica and return on your own. Its Viator twin priced this option at $249 on dates we checked in late October 2026."
  - question: "Will the balloon fly over the pyramids?"
    answer: "It depends on the wind. Operators steer for the archaeological zone when they can, but none can promise the route. See <a href='/guides/do-balloons-fly-over-teotihuacan-pyramids/'>do balloons fly over the pyramids</a>."

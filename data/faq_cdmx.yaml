title: "Pickup and Transport FAQ"
subtitle: "Short answers on pickup times, neighborhoods, Airbnbs and getting back to Mexico City."
items:
  - question: "What time is hotel pickup for a Teotihuacán balloon ride?"
    answer: "Typically between about 4:30 and 5:30 a.m., and the operator confirms the exact time the day before. Explora México's listing, for example, collects between 4:30 and 4:50 for a 5:30 arrival in the valley. Reply to the confirmation message so a changed time does not catch you out."
  - question: "How long is the drive from Mexico City to the balloon port?"
    answer: "Roughly 45 to 60 minutes before dawn, when the roads are empty, for a trip of about 45 to 50 km northeast. Operators quote anything from 45 minutes to an hour, and a hotel pickup loop adds time. Our <a href='/guides/how-to-get-to-teotihuacan-balloon-port/'>getting to the balloon port guide</a> covers driving yourself."
  - question: "Which neighborhoods do the transfers cover?"
    answer: "It depends on the operator. We Fly's express option on Viator names Juárez, Condesa, Roma and Polanco; We Fly's own website describes free pickup within 4 km of the Ángel de la Independencia and does not list Polanco. Volare picks up at selected hotels. Amigo Tours meets everyone at the Ángel, and the private packages collect from your accommodation."
  - question: "Can I be picked up from an Airbnb?"
    answer: "Sometimes. Luxury Tours starts at your hotel or house within Mexico City, and the private packages collect from your accommodation. Globos Aerostáticos Teotihuacán says its transport does not pick up from private homes or Airbnbs. If a listing says selected hotels, message the operator with your address before booking, or choose a tour that meets at the Ángel."
  - question: "Can I take the public bus to a sunrise flight?"
    answer: "No. The Autobuses Teotihuacan ticket window at Terminal Norte opens at 6:00, after balloon check-in, and the buses stop at the archaeological zone's gates, not at the launch fields."
  - question: "What time will I be back in Mexico City?"
    answer: "With a straight return, mid-morning: one operator gives 10:00 a.m., and Volare puts its transport option at about six hours from pickup to drop-off. If you add the ruins, expect early afternoon, about 1:00 p.m. with Excellentravel and 1:00 to 2:00 with Explora México. See <a href='/guides/what-to-do-after-teotihuacan-balloon-flight/'>what to do after the flight</a>."
  - question: "Is the transport option worth the extra cost?"
    answer: "For most visitors without a car, yes. On Volare it was $27 more than the drive-yourself option on dates we checked in late October 2026: $186 against $159. Compare every package on our <a href='/teotihuacan-balloon-ride-prices/'>prices page</a>."

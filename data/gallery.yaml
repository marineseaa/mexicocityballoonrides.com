items:
  - src: "/images/gallery/teotihuacan-1.webp"
    alt: "A green, yellow and white hot-air balloon in a clear blue sky above the Pyramid of the Moon, with dry fields, trees and a long mountain behind"
    caption: "A lone balloon above the Pyramid of the Moon on a clear morning"
  - src: "/images/gallery/teotihuacan-2.webp"
    alt: "Aerial view of balloons drifting through morning haze over the square walled enclosure of the Temple of Quetzalcoatl, with a town and green fields beyond"
    caption: "Low sun and haze over the Temple of Quetzalcoatl enclosure"
  - src: "/images/gallery/teotihuacan-3.webp"
    alt: "Dozens of hot-air balloons silhouetted against the rising sun over the hazy Teotihuacán valley"
    caption: "Dozens of balloons in the air as the sun comes up"
  - src: "/images/gallery/teotihuacan-4.webp"
    alt: "A pink, purple and blue checked balloon flying over a small town and fields, with green hills behind"
    caption: "Over the villages: the wind decides the route"
  - src: "/images/gallery/teotihuacan-5.webp"
    alt: "View from the Pyramid of the Moon down the Avenue of the Dead, with stepped platforms in the foreground and the Pyramid of the Sun in the distance"
    caption: "The Avenue of the Dead and the Pyramid of the Sun, from the ground"

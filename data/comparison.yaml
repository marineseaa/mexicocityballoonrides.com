# Homepage comparison table. Row-centric shape (rows[].values[] in column order).
# Plain Unicode only: comparison.html prints cell values without safeHTML.
# Prices: option-level prices read from the operators' Viator schedules on
# 25 October 2026 (TOURS-DIGEST.md), not the listings' headline "from" figures.
# The first row is NOT labelled "Starting Price" on purpose: that label makes the
# template overwrite the highlighted cell with the flight-only from-price.
# Restrictions, inclusions and flight length: each listing's own text (TOURS-DIGEST.md).
# Admission fee: ../scrape/ledger.md section 5 (INAH, 2026).
title: "Four Ways to Fly Over Teotihuacán, Compared"
subtitle: "Four popular balloon rides and the options that actually matter, with prices checked for dates in late October 2026. They differ most in transport, breakfast and what happens at the pyramids."


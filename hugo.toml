[[params.steps]]
  number = "1"
  title  = "Choose the option, not just the listing"
  body   = "Most listings sell several options. The headline price is usually the flight alone; hotel pickup, the cave breakfast and a guided pyramids visit cost more."
[[params.steps]]
  number = "2"
  title  = "Book a morning early in your trip"
  body   = "Flights depend on the wind at dawn. An early date leaves room to reschedule if the operator cancels for weather."
[[params.steps]]
  number = "3"
  title  = "Confirm pickup the day before"
  body   = "Operators send the pickup time or the balloon port location by message the day before. Pickups from Mexico City usually leave between about 4:30 and 5:40 a.m."
[[params.steps]]
  number = "4"
  title  = "Fly at sunrise, then explore"
  body   = "You fly for roughly 45 to 60 minutes, land with a toast and a certificate, and most packages continue to breakfast and the archaeological zone."

